<style>
  :root {
    --bg: #efe9dc;

    -webkit-tap-highlight-color: transparent;

    margin-bottom: 14px;
    box-shadow: 0 1px 3px rgba(58,50,38,0.06);
  }

      linear-gradient(180deg, #e8dcc4 0%, #e3ddc1 55%, #cdd6ad 100%);

    overflow: hidden;
    position: relative;
    box-shadow: 0 1px 3px rgba(58,50,38,0.06);
  }

    background: var(--card);
    border-radius: 12px;
    padding: 12px;
    font-size: 14px;
    font-weight: 500;
    color: var(--ink);
    cursor: pointer;
  }
