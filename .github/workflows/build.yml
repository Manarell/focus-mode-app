name: Build APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Download tree images and audio
        run: |
          mkdir -p app/src/main/assets/assets
          curl -L "https://images.stockcake.com/public/6/5/9/659c85a1-3a6f-457f-96ca-0cba5b26938c_medium/majestic-oak-awakens-stockcake.jpg" -o app/src/main/assets/assets/tree-full.jpg
          cp app/src/main/assets/assets/tree-full.jpg app/src/main/assets/assets/tree-bare-trunk.jpg
          cp app/src/main/assets/assets/tree-full.jpg app/src/main/assets/assets/tree-sapling.jpg
          cp app/src/main/assets/assets/tree-full.jpg app/src/main/assets/assets/tree-young-tree.jpg
          cp app/src/main/assets/assets/tree-full.jpg app/src/main/assets/assets/tree-flourishing.jpg
          curl -L "https://bigsoundbank.com/UPLOAD/mp3/0100.mp3" -o app/src/main/assets/assets/forest-ambience.mp3

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: 8.7

      - name: Build debug APK
        run: gradle assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: focus-mode-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
