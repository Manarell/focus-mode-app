.github/workflows/build.yml          ← builds the APK automatically on every push
build.gradle                          ← project config
settings.gradle
app/build.gradle                      ← app config
app/src/main/AndroidManifest.xml
app/src/main/java/com/focusmode/app/MainActivity.kt
app/src/main/java/com/focusmode/app/BlockAccessibilityService.kt
app/src/main/res/xml/accessibility_service_config.xml
app/src/main/assets/index.html        ← the app you already pasted, moved here
app/src/main/assets/assets/*          ← the 6 tree/audio files (binary — needs upload)name: Build APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: 8.7

      - name: Build debug APK
        run: gradle assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: focus-mode-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
